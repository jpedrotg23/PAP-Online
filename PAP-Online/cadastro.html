<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAP Online | Cadastro</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-bg"><main class="auth-card signup-card">
<div class="brand"><span class="brand-mark">PAP</span><strong>PAP Online</strong></div><header class="auth-heading"><h1>Criar sua conta</h1><p>Exclusivo para estudantes com vínculo ativo na Unifor</p></header>
<form id="signupForm" class="signup-form">
<label class="full">Nome completo <em>*</em><input required placeholder="Como consta na matrícula"></label>
<div class="two-col"><label>Matrícula Unifor <em>*</em><input required placeholder="Ex.: 2412345"><small>Confirmaremos seu vínculo ativo com a Unifor.</small></label><label>Tipo de vínculo <em>*</em><select required><option value="">Selecione...</option><option>Aluno</option><option>Professor</option><option>Funcionário</option></select></label></div>
<div class="two-col"><label>E-mail institucional <em>*</em><input type="email" required placeholder="nome@edu.unifor.br"></label><label>Telefone <em>*</em><input required placeholder="(85) 99999-9999"></label></div>
<label>Senha <em>*</em><div class="password-wrap"><input id="newPassword" type="password" minlength="8" required placeholder="Mínimo de 8 caracteres"><button class="eye" type="button" data-toggle="newPassword">◉</button></div><div class="strength"><span id="strengthBar"></span></div><small id="strengthText">Força da senha</small><div class="password-rules"><span>8 caracteres</span><span>1 maiúscula</span><span>1 minúscula</span><span>1 número</span></div></label>
<label>Confirmar senha <em>*</em><div class="password-wrap"><input id="confirmPassword" type="password" required placeholder="Repita a senha"><button class="eye" type="button" data-toggle="confirmPassword">◉</button></div></label>
<label class="consent"><input type="checkbox" required><span>Li e concordo com o <a href="#" class="local-link">Termo de consentimento</a> para o tratamento dos meus dados pessoais e dos meus dados sensíveis de saúde, conforme a Lei nº 13.709/2018 (LGPD). Veja também os <a href="#" class="local-link">Termos de Uso</a> e a <a href="#" class="local-link">Política de Privacidade</a>.</span></label>
<button class="primary-btn" type="submit">Criar conta</button></form><p class="auth-footer">Já possui conta? <a href="index.html">Faça login</a></p><p class="notice" id="signupNotice"></p></main><script src="js/app.js"></script></body></html>
