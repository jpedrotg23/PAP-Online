<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PAP Online | Nova senha</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-bg">
<main class="auth-card recovery-card">

    <div class="steps">
        <b class="done">1</b><i class="done-line"></i><b class="done">2</b><i class="done-line"></i><b
            class="active">3</b>
    </div>

    <header class="auth-heading">
        <h1>Definir nova senha</h1>
        <p>Crie uma senha forte para proteger sua conta. Você usará ela nas próximas vezes que entrar.</p>
    </header>

    <form id="resetForm">
        <label>Nova senha
            <div class="password-wrap">
                <input id="resetPassword" type="password" minlength="8" required placeholder="Mínimo de 8 caracteres">
                <button class="eye" type="button" data-toggle="resetPassword" aria-label="Mostrar senha"></button>
            </div>
            <div class="strength"><span id="resetStrengthBar"></span></div>
            <small id="resetStrengthText">Força da senha</small>
            <div class="password-rules"><span>8 caracteres</span><span>1 maiúscula</span><span>1 minúscula</span><span>1 número</span></div>
        </label>
        <label>Confirmar nova senha
            <div class="password-wrap">
                <input id="resetConfirm" type="password" required placeholder="Repita a nova senha">
                <button class="eye" type="button" data-toggle="resetConfirm" aria-label="Mostrar senha"></button>
            </div>
        </label>
        <button class="primary-btn" type="submit">Redefinir senha</button>
    </form>

    <p id="resetNotice" class="notice" role="status"></p>

    <p class="auth-footer"><a href="/index.html">Voltar ao login</a></p>

</main>

<script src="/js/api-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/recuperar.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
