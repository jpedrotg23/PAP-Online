<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PAP Online | Minha agenda</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/portais.css">
    <style>
        .pap-loading-overlay {
            position: fixed;
            inset: 0;
            background: #f7f9fc;
            z-index: 99999;
            display: grid;
            place-items: center;
            color: #667085;
            font: 500 13px Inter, Arial, sans-serif;
            letter-spacing: .2px;
        }

        .agenda-semana {
            display: grid;
            grid-template-columns:repeat(7, minmax(0, 1fr));
            gap: 8px;
            padding: 14px 18px;
            background: #fff;
            border: 1px solid var(--portal-line);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .agenda-dia {
            min-width: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 6px;
            border: 1px solid #e0e7f1;
            border-radius: 10px;
            background: #f6f8fc;
            cursor: pointer;
            font-family: inherit;
            color: #34415a;
            transition: all .15s;
        }

        .agenda-dia:hover {
            border-color: #7ba1f5;
            background: #f7faff;
        }

        .agenda-dia.selecionado {
            background: #2059dc;
            border-color: #2059dc;
            color: #fff;
        }

        .agenda-dia.hoje:not(.selecionado) {
            border-color: #2059dc;
        }

        .agenda-dia-nome {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #98a3b5;
        }

        .agenda-dia.selecionado .agenda-dia-nome {
            color: rgba(255, 255, 255, .85);
        }

        .agenda-dia-num {
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
        }

        .agenda-dia-badge {
            font-size: 9px;
            font-weight: 700;
            background: #2059dc;
            color: #fff;
            border-radius: 99px;
            padding: 1px 6px;
            min-width: 18px;
            text-align: center;
        }

        .agenda-dia.selecionado .agenda-dia-badge {
            background: rgba(255, 255, 255, .25);
        }

        .agenda-dia-badge.vazio {
            visibility: hidden;
        }

        .agenda-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .agenda-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .agenda-nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #dfe6f1;
            color: #64738d;
            cursor: pointer;
            font-size: 14px;
            transition: border-color .15s;
        }

        .agenda-nav-btn:hover {
            border-color: #7ba1f5;
            color: #2059dc;
        }

        .agenda-mes {
            font-size: 14px;
            font-weight: 700;
            color: var(--portal-text);
            text-transform: capitalize;
            min-width: 160px;
            text-align: center;
        }

        .agenda-filtros select {
            height: 34px;
            padding: 0 11px;
            border: 1px solid #dfe6f1;
            border-radius: 8px;
            background: #fff;
            font: 600 11px Inter, Arial, sans-serif;
            color: #34415a;
            cursor: pointer;
        }

        .agenda-stats {
            display: grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .agenda-stat {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--portal-line);
            border-radius: 12px;
        }

        .agenda-stat-ico {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .agenda-stat-ico.blue {
            background: #e8f0ff;
            color: #2059dc;
        }

        .agenda-stat-ico.green {
            background: #e5f6ef;
            color: #0b8b61;
        }

        .agenda-stat-ico.orange {
            background: #fff1df;
            color: #c35b0b;
        }

        .agenda-stat small {
            display: block;
            font-size: 10px;
            color: #7e8ba2;
            margin-bottom: 3px;
        }

        .agenda-stat strong {
            font-size: 20px;
            color: var(--portal-text);
            line-height: 1;
        }

        /* Card de atendimento */
        .agenda-atendimento {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 18px;
            border: 1px solid var(--portal-line);
            border-radius: 11px;
            background: #fff;
            margin-bottom: 10px;
        }

        .agenda-atendimento:last-child {
            margin-bottom: 0;
        }

        .agenda-atendimento-main {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .agenda-atendimento-hora {
            min-width: 74px;
            text-align: center;
            border-right: 1px solid #e4eaf2;
            padding-right: 16px;
        }

        .agenda-atendimento-hora b {
            display: block;
            font-size: 16px;
            color: #1749a9;
            line-height: 1.1;
        }

        .agenda-atendimento-hora small {
            display: block;
            font-size: 10px;
            color: #7e8ba2;
            margin-top: 3px;
        }

        .agenda-atendimento-info {
            flex: 1;
            min-width: 0;
        }

        .agenda-atendimento-info strong {
            display: block;
            font-size: 13px;
            color: var(--portal-text);
            margin-bottom: 3px;
        }

        .agenda-atendimento-info small {
            display: block;
            font-size: 11px;
            color: #7e8ba2;
            line-height: 1.4;
        }

        /* Footer de ações */
        .agenda-atendimento-acoes {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px dashed #e4eaf2;
        }

        /* Botões de ação — claros, coloridos, alinhados ao portal-button */
        .pap-acao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            box-sizing: border-box;
            border-radius: 9px;
            border: 1.5px solid transparent;
            font: 700 12px Inter, Arial, sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }

        .pap-acao:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(32, 89, 220, .20);
        }

        .pap-acao--finalizar {
            background: #2059dc;
            color: #fff;
            border-color: #2059dc;
        }

        .pap-acao--finalizar:hover {
            background: #1a4dc4;
            border-color: #1a4dc4;
        }

        .pap-acao--falta {
            background: #fff8e6;
            color: #8a5a00;
            border-color: #f5d67a;
        }

        .pap-acao--falta:hover {
            background: #fff0cc;
            border-color: #e5c160;
        }

        .pap-acao--cancelar {
            background: #fff;
            color: #b42318;
            border-color: #f7c9c4;
        }

        .pap-acao--cancelar:hover {
            background: #fdecea;
            border-color: #eab1a9;
        }

        /* Pills de status — auto-contidas para funcionar em pro-body sem depender de .portal-pill */
        .pap-status-pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 11px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .pap-status-pill.info {
            background: #eaf1ff;
            color: #2059dc;
        }

        .pap-status-pill.success {
            background: #e5f6ef;
            color: #0b8b61;
        }

        .pap-status-pill.danger {
            background: #ffeae8;
            color: #d42f26;
        }

        .pap-status-pill.warning {
            background: #fff1df;
            color: #c35b0b;
        }

        .agenda-empty {
            padding: 32px 20px;
            text-align: center;
            border: 1px dashed #dfe6f1;
            border-radius: 10px;
            background: #fbfcfe;
            color: #75829c;
            font-size: 12px;
            line-height: 1.6;
        }

        .agenda-empty b {
            display: block;
            color: #34415a;
            font-size: 13px;
            margin-bottom: 5px;
        }

        /* Modal */
        .pap-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            backdrop-filter: blur(2px);
            display: grid;
            place-items: center;
            padding: 16px;
            z-index: 99999;
            animation: papFade .18s ease;
        }

        @keyframes papFade {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }

        .pap-modal {
            background: #fff;
            width: min(500px, 100%);
            max-height: 90vh;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .30);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: papSlide .20s ease;
        }

        @keyframes papSlide {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .pap-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e4eaf2;
        }

        .pap-modal-header h3 {
            margin: 0;
            font-size: 15px;
            color: #1f2937;
            font-weight: 700;
        }

        .pap-modal-close {
            background: none;
            border: 0;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #6b7280;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .pap-modal-close:hover {
            background: #f1f4f9;
        }

        .pap-modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .pap-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 20px;
            border-top: 1px solid #e4eaf2;
            background: #fafbfd;
        }

        .pap-modal-btn {
            min-height: 40px;
            padding: 0 18px;
            border-radius: 8px;
            border: 0;
            font: 700 12px Inter, Arial, sans-serif;
            cursor: pointer;
        }

        .pap-modal-btn[disabled] {
            opacity: .55;
            cursor: not-allowed;
        }

        .pap-modal-btn--ghost {
            background: #eef1f6;
            color: #374151;
        }

        .pap-modal-btn--ghost:hover:not([disabled]) {
            background: #e2e7f0;
        }

        .pap-modal-btn--primary {
            background: #2059dc;
            color: #fff;
        }

        .pap-modal-btn--primary:hover:not([disabled]) {
            background: #1a4dc4;
        }

        .pap-modal-btn--danger {
            background: #c82333;
            color: #fff;
        }

        .pap-modal-btn--danger:hover:not([disabled]) {
            background: #a81c2a;
        }

        .pap-modal-text {
            font-size: 13px;
            color: #374151;
            line-height: 1.55;
            margin: 0 0 12px;
        }

        .pap-modal-info {
            background: #f7faff;
            border: 1px solid #d6e3fb;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .pap-modal-info-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            padding: 5px 0;
        }

        .pap-modal-info-row + .pap-modal-info-row {
            border-top: 1px dashed #d6e3fb;
            margin-top: 5px;
            padding-top: 10px;
        }

        .pap-modal-info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .pap-modal-info-value {
            color: #1f2937;
            font-weight: 600;
            text-align: right;
        }

        .pap-modal-warning {
            background: #fff8e6;
            border: 1px solid #f5d67a;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }

        .pap-modal-warning b {
            display: block;
            color: #8a5a00;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .pap-modal-warning p {
            margin: 0;
            font-size: 12px;
            color: #6b4d00;
            line-height: 1.5;
        }

        @media (max-width: 760px) {
            .agenda-semana {
                grid-template-columns:repeat(7, 64px);
            }

            .agenda-stats {
                grid-template-columns:1fr;
            }

            .agenda-atendimento-main {
                flex-wrap: wrap;
            }

            .agenda-atendimento-hora {
                border-right: 0;
                border-bottom: 1px solid #e4eaf2;
                padding-right: 0;
                padding-bottom: 10px;
                width: 100%;
                text-align: left;
            }

            .agenda-atendimento-acoes {
                justify-content: stretch;
            }

            .pap-acao {
                flex: 1;
            }
        }
    </style>
</head>

<script>
    (function () {
        'use strict';

        const state = {
            usuario: null,
            atendimentos: [],
            alunosCache: {},
            diaSelecionado: null,
            inicioSemana: null,
            filtroStatus: 'all'
        };

        const STATUS_INFO = {
            AGENDADO: {rotulo: 'Agendado', classe: 'info'},
            CONFIRMADO: {rotulo: 'Confirmado', classe: 'success'},
            REALIZADO: {rotulo: 'Realizado', classe: 'success'},
            CANCELADO: {rotulo: 'Cancelado', classe: 'danger'},
            FALTA: {rotulo: 'Falta', classe: 'warning'}
        };

        // ---------- Helpers ----------
        function set(id, valor) {
            const el = document.getElementById(id);
            if (el) el.textContent = valor;
        }

        function iniciais(nome) {
            if (!nome) return 'US';
            const partes = nome.trim().split(/\s+/);
            if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
            return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[s]);
        }

        function isoDia(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dia = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dia}`;
        }

        function mesmoDia(a, b) {
            return a.getFullYear() === b.getFullYear()
                && a.getMonth() === b.getMonth()
                && a.getDate() === b.getDate();
        }

        function segundaDaSemana(d) {
            const copia = new Date(d);
            copia.setHours(0, 0, 0, 0);
            const diaSemana = copia.getDay();
            const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
            copia.setDate(copia.getDate() + offset);
            return copia;
        }

        function formatarHora(iso) {
            return new Date(iso).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
        }

        function formatarDataHoraCompleta(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('pt-BR', {
                weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
            }) + ' às ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
        }

        function formatarRestante(ms) {
            if (ms <= 0) return 'já passou';
            const dias = Math.floor(ms / 86400000);
            const horas = Math.floor((ms % 86400000) / 3600000);
            const mins = Math.floor((ms % 3600000) / 60000);
            if (dias > 0) return `${dias}d ${horas}h ${mins}min`;
            if (horas > 0) return `${horas}h ${mins}min`;
            return `${mins}min`;
        }

        function nomeAluno(id) {
            return state.alunosCache[id] || 'Aluno #' + id;
        }

        function statusInfo(status) {
            return STATUS_INFO[status] || {rotulo: status || '—', classe: 'info'};
        }

        // ---------- Modal ----------
        let modalKeyHandler = null;

        function fecharModal() {
            const el = document.getElementById('papProfModal');
            if (el) el.remove();
            if (modalKeyHandler) {
                document.removeEventListener('keydown', modalKeyHandler);
                modalKeyHandler = null;
            }
        }

        function abrirModal(opts) {
            fecharModal();
            const overlay = document.createElement('div');
            overlay.className = 'pap-modal-overlay';
            overlay.id = 'papProfModal';
            overlay.innerHTML = `
            <div class="pap-modal" role="dialog" aria-modal="true">
                <header class="pap-modal-header">
                    <h3>${opts.titulo || ''}</h3>
                    <button type="button" class="pap-modal-close" aria-label="Fechar">×</button>
                </header>
                <div class="pap-modal-body">${opts.corpo || ''}</div>
                <footer class="pap-modal-footer">
                    <button type="button" class="pap-modal-btn pap-modal-btn--ghost" data-fechar>
                        ${opts.labelCancelar || 'Voltar'}
                    </button>
                    <button type="button" class="pap-modal-btn pap-modal-btn--${opts.perigo ? 'danger' : 'primary'}"
                            data-confirmar>${opts.labelConfirmar || 'Confirmar'}</button>
                </footer>
            </div>`;
            document.body.appendChild(overlay);

            overlay.querySelector('.pap-modal-close').addEventListener('click', fecharModal);
            overlay.querySelector('[data-fechar]').addEventListener('click', fecharModal);
            overlay.addEventListener('click', (ev) => {
                if (ev.target === overlay) fecharModal();
            });

            modalKeyHandler = (ev) => {
                if (ev.key === 'Escape') fecharModal();
            };
            document.addEventListener('keydown', modalKeyHandler);

            overlay.querySelector('[data-confirmar]').addEventListener('click', (ev) => {
                opts.onConfirmar(ev.currentTarget, overlay);
            });
            return overlay;
        }

        async function extrairMensagem(resposta, padrao) {
            try {
                const corpo = await resposta.json();
                return corpo && corpo.message ? corpo.message : padrao;
            } catch (_) {
                return padrao;
            }
        }

        // ---------- Ações ----------
        async function acaoFinalizar(id) {
            abrirModal({
                titulo: 'Finalizar atendimento',
                corpo: `
                <p class="pap-modal-text">Confirma que este atendimento foi realizado?</p>
                <div class="pap-modal-warning">
                    <b>Atenção</b>
                    <p>Após finalizar, o status fica <b>REALIZADO</b> e não pode ser alterado.</p>
                </div>`,
                labelCancelar: 'Cancelar',
                labelConfirmar: 'Sim, finalizar',
                onConfirmar: async (btn) => {
                    btn.disabled = true;
                    btn.textContent = 'Finalizando…';
                    try {
                        const r = await fetch(`/atendimentos/${id}/finalizar`, {
                            method: 'PATCH', credentials: 'include'
                        });
                        if (!r.ok) throw new Error(await extrairMensagem(r, 'Não foi possível finalizar.'));
                        fecharModal();
                        window.alert('Atendimento finalizado com sucesso.');
                        await carregarAtendimentos();
                    } catch (e) {
                        console.error('erro finalizar:', e);
                        window.alert(e.message || 'Erro ao finalizar.');
                        btn.disabled = false;
                        btn.textContent = 'Sim, finalizar';
                    }
                }
            });
        }

        async function acaoRegistrarFalta(id) {
            abrirModal({
                titulo: 'Registrar falta',
                corpo: `
                <p class="pap-modal-text">Confirma que o aluno faltou a este atendimento?</p>
                <div class="pap-modal-warning">
                    <b>Regra de faltas</b>
                    <p>Três faltas no semestre suspendem novos agendamentos do aluno.</p>
                </div>`,
                labelCancelar: 'Cancelar',
                labelConfirmar: 'Sim, registrar falta',
                perigo: true,
                onConfirmar: async (btn) => {
                    btn.disabled = true;
                    btn.textContent = 'Registrando…';
                    try {
                        const r = await fetch(`/atendimentos/${id}/falta`, {
                            method: 'PATCH', credentials: 'include'
                        });
                        if (!r.ok) throw new Error(await extrairMensagem(r, 'Não foi possível registrar falta.'));
                        fecharModal();
                        window.alert('Falta registrada com sucesso.');
                        await carregarAtendimentos();
                    } catch (e) {
                        console.error('erro falta:', e);
                        window.alert(e.message || 'Erro ao registrar falta.');
                        btn.disabled = false;
                        btn.textContent = 'Sim, registrar falta';
                    }
                }
            });
        }

        async function acaoCancelar(id) {
            let atendimento = null;
            try {
                const r = await fetch(`/atendimentos/${id}`, {credentials: 'include'});
                if (r.ok) atendimento = await r.json();
            } catch (_) {
            }

            let blocoInfo = '';
            if (atendimento && atendimento.dataHoraInicio) {
                const restanteMs = new Date(atendimento.dataHoraInicio).getTime() - Date.now();
                const viraFalta = restanteMs < 24 * 3600 * 1000 && restanteMs > 0;
                blocoInfo = `
                <div class="pap-modal-info">
                    <div class="pap-modal-info-row">
                        <span class="pap-modal-info-label">Agendado para</span>
                        <span class="pap-modal-info-value">${formatarDataHoraCompleta(atendimento.dataHoraInicio)}</span>
                    </div>
                    <div class="pap-modal-info-row">
                        <span class="pap-modal-info-label">Faltam</span>
                        <span class="pap-modal-info-value">${formatarRestante(restanteMs)}</span>
                    </div>
                </div>
                ${viraFalta ? `<div class="pap-modal-warning"><b>Atenção</b><p>Como faltam <b>menos de 24h</b>, o cancelamento será registrado como <b>FALTA</b>.</p></div>` : ''}`;
            }

            abrirModal({
                titulo: 'Cancelar atendimento',
                corpo: `${blocoInfo}<p class="pap-modal-text">Tem certeza de que deseja cancelar?</p>`,
                labelCancelar: 'Não, manter',
                labelConfirmar: 'Sim, cancelar',
                perigo: true,
                onConfirmar: async (btn) => {
                    btn.disabled = true;
                    btn.textContent = 'Cancelando…';
                    try {
                        const r = await fetch(`/atendimentos/${id}/cancelar`, {
                            method: 'PATCH', credentials: 'include'
                        });
                        if (!r.ok) throw new Error(await extrairMensagem(r, 'Não foi possível cancelar.'));
                        const atualizado = await r.json();
                        fecharModal();
                        window.alert(atualizado.status === 'FALTA'
                            ? 'Cancelamento registrado como FALTA (menos de 24h).'
                            : 'Atendimento cancelado com sucesso.');
                        await carregarAtendimentos();
                    } catch (e) {
                        console.error('erro cancelar:', e);
                        window.alert(e.message || 'Erro ao cancelar.');
                        btn.disabled = false;
                        btn.textContent = 'Sim, cancelar';
                    }
                }
            });
        }

        // ---------- Delegação de clique ----------
        document.addEventListener('click', (ev) => {
            const btn = ev.target.closest('[data-prof-acao]');
            if (!btn) return;
            ev.preventDefault();
            const acao = btn.dataset.profAcao;
            const id = btn.dataset.atendimentoId;
            if (!id) return;
            if (acao === 'finalizar') acaoFinalizar(id);
            else if (acao === 'falta') acaoRegistrarFalta(id);
            else if (acao === 'cancelar') acaoCancelar(id);
        });

        // Expõe para testar no console
        window.papProf = {finalizar: acaoFinalizar, falta: acaoRegistrarFalta, cancelar: acaoCancelar};

        // ---------- Dados ----------
        async function carregarUsuario() {
            try {
                const r = await fetch('/auth/session', {credentials: 'include'});
                if (!r.ok) return null;
                state.usuario = await r.json();
                set('userName', state.usuario.nome || 'Profissional');
                set('userDetail', state.usuario.email || '—');
                const av = document.getElementById('userAvatar');
                if (av) av.textContent = iniciais(state.usuario.nome);
                const dataAtual = new Date().toLocaleDateString('pt-BR', {
                    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
                });
                set('dataAtual', dataAtual.charAt(0).toUpperCase() + dataAtual.slice(1));
                return state.usuario;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function carregarNotificacoes() {
            if (!state.usuario?.id) return;
            try {
                const r = await fetch(`/notificacoes/usuario/${state.usuario.id}/count`, {credentials: 'include'});
                if (!r.ok) return;
                const count = await r.json();
                const badge = document.getElementById('badgeNotificacoes');
                if (badge) {
                    if (count > 0) {
                        badge.textContent = count > 9 ? '9+' : String(count);
                        badge.style.display = '';
                    } else badge.style.display = 'none';
                }
            } catch (_) {
            }
        }

        async function carregarAlunos() {
            try {
                const r = await fetch('/alunos', {credentials: 'include'});
                if (!r.ok) return;
                const alunos = await r.json();
                alunos.forEach(a => {
                    state.alunosCache[a.id] = a.nome;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function carregarAtendimentos() {
            try {
                const r = await fetch(`/atendimentos/profissional/${state.usuario.id}`, {
                    credentials: 'include'
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                state.atendimentos = await r.json();
                renderizarTudo();
            } catch (e) {
                console.error('erro ao carregar:', e);
                document.getElementById('listaAtendimentos').innerHTML =
                    '<div class="agenda-empty"><b>Não foi possível carregar</b>Tente novamente.</div>';
            }
        }

        // ---------- Renderização ----------
        function renderizarTudo() {
            renderizarSemana();
            renderizarStats();
            renderizarLista();
        }

        function renderizarSemana() {
            const container = document.getElementById('agendaSemana');
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            if (!state.inicioSemana) state.inicioSemana = segundaDaSemana(hoje);
            if (!state.diaSelecionado) state.diaSelecionado = hoje;

            const dias = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(state.inicioSemana);
                d.setDate(d.getDate() + i);
                dias.push(d);
            }
            const mesLabel = dias[0].toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
            set('agendaMesAtual', mesLabel.charAt(0).toUpperCase() + mesLabel.slice(1));

            container.innerHTML = dias.map(d => {
                const iso = isoDia(d);
                const count = state.atendimentos.filter(a =>
                    a.dataHoraInicio && isoDia(new Date(a.dataHoraInicio)) === iso
                ).length;
                const nomeDia = d.toLocaleDateString('pt-BR', {weekday: 'short'}).replace('.', '').toUpperCase();
                const isHoje = mesmoDia(d, hoje);
                const isSel = mesmoDia(d, state.diaSelecionado);
                return `
                <button type="button" class="agenda-dia ${isSel ? 'selecionado' : ''} ${isHoje ? 'hoje' : ''}"
                        data-dia="${iso}">
                    <span class="agenda-dia-nome">${nomeDia}</span>
                    <span class="agenda-dia-num">${d.getDate()}</span>
                    <span class="agenda-dia-badge ${count === 0 ? 'vazio' : ''}">${count}</span>
                </button>`;
            }).join('');

            container.querySelectorAll('.agenda-dia').forEach(btn => {
                btn.addEventListener('click', () => {
                    const [y, m, dd] = btn.dataset.dia.split('-').map(Number);
                    state.diaSelecionado = new Date(y, m - 1, dd);
                    renderizarSemana();
                    renderizarLista();
                    renderizarStats();
                });
            });
        }

        function atendimentosDoDia() {
            const iso = isoDia(state.diaSelecionado);
            return state.atendimentos
                .filter(a => a.dataHoraInicio && isoDia(new Date(a.dataHoraInicio)) === iso)
                .sort((a, b) => new Date(a.dataHoraInicio) - new Date(b.dataHoraInicio));
        }

        function renderizarStats() {
            const doDia = atendimentosDoDia();
            const agora = new Date();
            const proximos = doDia.filter(a =>
                (a.status === 'AGENDADO' || a.status === 'CONFIRMADO') && new Date(a.dataHoraInicio) > agora
            ).length;
            const finalizados = doDia.filter(a => a.status === 'REALIZADO').length;
            set('statDia', String(doDia.length));
            set('statProximos', String(proximos));
            set('statFinalizados', String(finalizados));
        }

        function renderizarLista() {
            const container = document.getElementById('listaAtendimentos');
            const labelDia = state.diaSelecionado.toLocaleDateString('pt-BR', {
                weekday: 'long', day: '2-digit', month: 'long'
            });
            set('diaSelecionadoLabel', labelDia.charAt(0).toUpperCase() + labelDia.slice(1));

            let lista = atendimentosDoDia();
            if (state.filtroStatus !== 'all') {
                lista = lista.filter(a => a.status === state.filtroStatus);
            }

            if (!lista.length) {
                const msg = atendimentosDoDia().length === 0
                    ? {titulo: 'Nenhum atendimento neste dia', texto: 'Escolha outro dia ou navegue para outra semana.'}
                    : {titulo: 'Nenhum resultado para o filtro', texto: 'Ajuste o filtro de status.'};
                container.innerHTML = `<div class="agenda-empty"><b>${msg.titulo}</b>${msg.texto}</div>`;
                return;
            }

            container.innerHTML = lista.map(a => {
                const info = statusInfo(a.status);
                const inicio = new Date(a.dataHoraInicio);
                const inicioPassou = inicio <= new Date();
                const permiteAcoes = a.status === 'AGENDADO' || a.status === 'CONFIRMADO';

                let botoes = '';
                if (permiteAcoes) {
                    if (inicioPassou) {
                        botoes += `<button type="button" class="pap-acao pap-acao--finalizar"
                        data-prof-acao="finalizar" data-atendimento-id="${a.id}">Finalizar</button>`;
                        botoes += `<button type="button" class="pap-acao pap-acao--falta"
                        data-prof-acao="falta" data-atendimento-id="${a.id}">Registrar falta</button>`;
                    }
                    botoes += `<button type="button" class="pap-acao pap-acao--cancelar"
                    data-prof-acao="cancelar" data-atendimento-id="${a.id}">Cancelar</button>`;
                }

                return `
                <div class="agenda-atendimento">
                    <div class="agenda-atendimento-main">
                        <div class="agenda-atendimento-hora">
                            <b>${formatarHora(a.dataHoraInicio)}</b>
                            <small>${a.dataHoraFim ? formatarHora(a.dataHoraFim) : ''}</small>
                        </div>
                        <div class="agenda-atendimento-info">
                            <strong>${escapeHtml(nomeAluno(a.alunoId))}</strong>
                            <small>${a.modalidade ? a.modalidade.toLowerCase() : 'presencial'}${a.local ? ' · ' + escapeHtml(a.local) : ''}</small>
                        </div>
                        <span class="pap-status-pill ${info.classe}">${info.rotulo}</span>
                    </div>
                    ${botoes ? `<div class="agenda-atendimento-acoes">${botoes}</div>` : ''}
                </div>`;
            }).join('');
        }

        function navegarSemana(delta) {
            const nova = new Date(state.inicioSemana);
            nova.setDate(nova.getDate() + delta * 7);
            state.inicioSemana = nova;
            const diaSel = new Date(state.diaSelecionado);
            diaSel.setDate(diaSel.getDate() + delta * 7);
            state.diaSelecionado = diaSel;
            renderizarSemana();
            renderizarLista();
            renderizarStats();
        }

        function ligarEventos() {
            document.getElementById('btnSemanaAnterior').addEventListener('click', () => navegarSemana(-1));
            document.getElementById('btnProximaSemana').addEventListener('click', () => navegarSemana(1));
            document.getElementById('filtroStatus').addEventListener('change', (e) => {
                state.filtroStatus = e.target.value;
                renderizarLista();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            ligarEventos();
            const u = await carregarUsuario();
            if (!u) {
                console.error('usuário não carregado');
                return;
            }
            await Promise.allSettled([carregarAlunos(), carregarNotificacoes()]);
            await carregarAtendimentos();
        });
    })();
</script>
</body>
</html>
