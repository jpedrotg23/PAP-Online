spring:
  application:
    name: paponline
  jpa:
    hibernate:
      ddl-auto: ${PAP_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${PAP_SESSION_COOKIE_SECURE:false}
        same-site: Lax

pap:
  demo:
    seed: false
  consent:
    version: ${PAP_CONSENT_VERSION:1.0}
  upload-dir: ${PAP_UPLOAD_DIR:uploads}
